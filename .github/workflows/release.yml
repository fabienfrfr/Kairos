name: Release (auto-tag)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write # lets this job dispatch publish.yml

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version from conventional commits since the last tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # no matching commit (no feat/fix/BREAKING CHANGE) -> don't tag
          release_branches: main
          # Conventional Commits mapping: fix -> patch, feat -> minor, "BREAKING CHANGE" -> major

      - name: Dispatch publish on the new tag
        if: steps.tag.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # tags pushed with GITHUB_TOKEN do not trigger on:push workflows, workflow_dispatch is allowed
        run: gh workflow run publish.yml --ref "${{ steps.tag.outputs.new_tag }}"
