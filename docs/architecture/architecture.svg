<svg viewBox="0 0 900 1150" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { stroke:#333; stroke-width:1.4; }
    .lbl { font-size:14px; fill:#111; text-anchor:middle; }
    .lbl-sm { font-size:11.5px; fill:#333; text-anchor:middle; }
    .title { font-size:20px; font-weight:bold; text-anchor:middle; fill:#111; }
    .sub { font-size:12px; fill:#555; text-anchor:middle; }
    .arr { stroke:#333; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
  </style>

  <text x="450" y="32" class="title">Kairos — Diffusion MoE, Multimodal Architecture</text>

  <!-- Input tokens -->
  <rect x="330" y="55" width="240" height="40" rx="6" class="box" fill="#eef2ff"/>
  <text x="450" y="80" class="lbl">input_ids + modality_ids</text>

  <!-- Embedding -->
  <rect x="300" y="120" width="300" height="46" rx="6" class="box" fill="#e0e7ff"/>
  <text x="450" y="140" class="lbl">KairosEmbedding</text>
  <text x="450" y="156" class="lbl-sm">token_embed + modality_embed</text>

  <line x1="450" y1="95" x2="450" y2="120" class="arr"/>

  <!-- Pyramidal codec -->
  <rect x="150" y="195" width="600" height="150" rx="8" class="box" fill="#fdf4ff"/>
  <text x="450" y="216" class="lbl" font-weight="bold">PyramidalConvCodec (num_scales)</text>
  <line x1="450" y1="166" x2="450" y2="195" class="arr"/>

  <g>
    <rect x="175" y="235" width="130" height="80" rx="6" class="box" fill="#fff"/>
    <text x="240" y="255" class="lbl-sm">scale 0</text>
    <text x="240" y="270" class="lbl-sm">stride^0</text>
    <text x="240" y="288" class="lbl-sm">conv down</text>

    <rect x="320" y="235" width="130" height="80" rx="6" class="box" fill="#fff"/>
    <text x="385" y="255" class="lbl-sm">scale 1</text>
    <text x="385" y="270" class="lbl-sm">stride^1</text>
    <text x="385" y="288" class="lbl-sm">conv down</text>

    <rect x="465" y="235" width="130" height="80" rx="6" class="box" fill="#fff"/>
    <text x="530" y="255" class="lbl-sm">scale 2</text>
    <text x="530" y="270" class="lbl-sm">stride^2</text>
    <text x="530" y="288" class="lbl-sm">conv down</text>

    <rect x="610" y="235" width="115" height="80" rx="6" class="box" fill="#fff"/>
    <text x="667" y="255" class="lbl-sm">scale 3</text>
    <text x="667" y="270" class="lbl-sm">stride^3</text>
    <text x="667" y="288" class="lbl-sm">conv down</text>
  </g>
  <text x="450" y="335" class="sub">modality_scales routes each modality's tokens to the scales it needs</text>

  <!-- per-scale backbone -->
  <line x1="450" y1="345" x2="450" y2="375" class="arr"/>
  <rect x="120" y="375" width="660" height="270" rx="8" class="box" fill="#f0fdf4"/>
  <text x="450" y="398" class="lbl" font-weight="bold">KairosDiffusionBackbone × num_scales (independent stacks)</text>

  <rect x="160" y="415" width="580" height="90" rx="6" class="box" fill="#fff"/>
  <text x="450" y="435" class="lbl-sm" font-weight="bold">DiffusionBlock (× n_layers, layers_config e.g. "ld")</text>
  <rect x="185" y="448" width="260" height="45" rx="5" class="box" fill="#dbeafe"/>
  <text x="315" y="465" class="lbl-sm">LiZAttention2</text>
  <text x="315" y="480" class="lbl-sm">SWA + DeltaNet (shared QKV/O)</text>
  <rect x="455" y="448" width="260" height="45" rx="5" class="box" fill="#fef9c3"/>
  <text x="585" y="465" class="lbl-sm">FFN or MoE</text>
  <text x="585" y="480" class="lbl-sm">DeepseekV3MoE (top-k routed + shared)</text>

  <rect x="160" y="520" width="580" height="55" rx="6" class="box" fill="#fff"/>
  <text x="450" y="542" class="lbl-sm" font-weight="bold">KairosAttnRes aggregator</text>
  <text x="450" y="560" class="lbl-sm">blocks of attnres_block_size layer outputs, learned weighted sum</text>

  <text x="450" y="600" class="sub">gather_active / scatter_active (seq-dim only, batch dim preserved)</text>
  <text x="450" y="618" class="sub">KairosCache: per-scale conv_caches + ssm_caches (DeltaNet) for streaming/state-carry</text>
  <text x="450" y="636" class="sub">SWA layers keep a separate sliding-window K/V cache, not carried across batches</text>

  <!-- fusion -->
  <line x1="450" y1="645" x2="450" y2="675" class="arr"/>
  <rect x="300" y="675" width="300" height="46" rx="6" class="box" fill="#fdf4ff"/>
  <text x="450" y="695" class="lbl">fusion: concat(scales) → Linear</text>
  <text x="450" y="711" class="lbl-sm">d_model × num_scales → d_model</text>

  <!-- norm + lm head -->
  <line x1="450" y1="721" x2="450" y2="750" class="arr"/>
  <rect x="330" y="750" width="240" height="40" rx="6" class="box" fill="#e0e7ff"/>
  <text x="450" y="775" class="lbl">KairosNorm</text>

  <line x1="450" y1="790" x2="450" y2="815" class="arr"/>
  <rect x="270" y="815" width="360" height="46" rx="6" class="box" fill="#e0e7ff"/>
  <text x="450" y="835" class="lbl">OutputHead (tied weights)</text>
  <text x="450" y="851" class="lbl-sm">token_head + modality_head</text>

  <line x1="450" y1="861" x2="450" y2="886" class="arr"/>
  <rect x="330" y="886" width="240" height="40" rx="6" class="box" fill="#eef2ff"/>
  <text x="450" y="911" class="lbl">logits (vocab × modality)</text>

  <!-- diffusion loss note -->
  <rect x="120" y="950" width="660" height="130" rx="8" class="box" fill="#fff7ed"/>
  <text x="450" y="973" class="lbl" font-weight="bold">Masked-diffusion training objective (KairosDiffusionTrainer)</text>
  <text x="450" y="995" class="lbl-sm">sample t ~ U(0,1), noise fraction p = (1-ε)t + ε</text>
  <text x="450" y="1013" class="lbl-sm">mask p·L random non-prompt tokens → predict originals back</text>
  <text x="450" y="1031" class="lbl-sm">loss = cross_entropy(logits[mask], x0[mask]) / p, averaged</text>
  <text x="450" y="1049" class="lbl-sm">non-finite batches skipped + logged (pipe.nan_log), not backpropped</text>
  <line x1="450" y1="926" x2="450" y2="950" class="arr"/>
</svg>
