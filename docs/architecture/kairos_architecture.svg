<svg viewBox="0 0 1220 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .box { stroke:#333; stroke-width:1.2; rx:5; }
    .sub { font-size:10.5px; fill:#222; }
    .note { font-size:9px; fill:#666; font-style:italic; }
    .arr { stroke:#333; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
    .dashed { stroke:#999; stroke-width:1; fill:none; stroke-dasharray:3,3; marker-end:url(#arrow); }
    .group-label { font-size:10.5px; font-weight:700; fill:#222; }
    .mask { fill:#c0392b; font-family:monospace; font-size:10px; }
    .clean { fill:#1e7a34; font-family:monospace; font-size:10px; }
  </style>

  <!-- input -->
  <rect class="box" x="6" y="70" width="88" height="42" fill="#eaf1fb"/>
  <text x="50" y="88" class="sub" text-anchor="middle">bytes +</text>
  <text x="50" y="101" class="sub" text-anchor="middle">modality_ids</text>
  <path class="arr" d="M94,91 L118,91"/>

  <!-- embedding -->
  <rect class="box" x="118" y="70" width="90" height="42" fill="#dbe7fb"/>
  <text x="163" y="87" class="sub" text-anchor="middle" font-weight="700">Kairos</text>
  <text x="163" y="99" class="sub" text-anchor="middle" font-weight="700">Embedding</text>
  <path class="arr" d="M208,91 L232,91"/>

  <!-- PyramidalCodec.encode -->
  <rect x="232" y="20" width="150" height="145" rx="6" fill="#f6effb" stroke="#8a6bb0" stroke-width="1.1"/>
  <text x="307" y="34" class="group-label" text-anchor="middle">PyramidalCodec</text>
  <text x="307" y="45" class="note" text-anchor="middle">.encode: 1 Linear/Conv per scale</text>
  <rect class="box" x="242" y="53" width="60" height="24" fill="#fff"/>
  <text x="272" y="69" class="sub" text-anchor="middle" font-size="9.5">scale 0</text>
  <rect class="box" x="312" y="53" width="60" height="24" fill="#fff"/>
  <text x="342" y="69" class="sub" text-anchor="middle" font-size="9.5">scale 1</text>
  <rect class="box" x="242" y="82" width="60" height="24" fill="#fff"/>
  <text x="272" y="98" class="sub" text-anchor="middle" font-size="9.5">scale 2</text>
  <rect class="box" x="312" y="82" width="60" height="24" fill="#fff"/>
  <text x="342" y="98" class="sub" text-anchor="middle" font-size="9.5">scale 3</text>
  <text x="307" y="118" class="note" text-anchor="middle">patch_size = stride^(k+1)</text>
  <text x="307" y="130" class="note" text-anchor="middle">gather_active: modality_scales</text>
  <text x="307" y="141" class="note" text-anchor="middle">routes each modality to its</text>
  <text x="307" y="152" class="note" text-anchor="middle">scale(s) only</text>
  <path class="arr" d="M382,91 L406,91"/>

  <!-- DiffusionBackbone x num_scales -->
  <rect x="406" y="6" width="330" height="175" rx="6" fill="#eefaf0" stroke="#4c9a5c" stroke-width="1.1"/>
  <text x="571" y="20" class="group-label" text-anchor="middle">DiffusionBackbone &#215; num_scales (independent stacks)</text>

  <rect class="box" x="422" y="30" width="298" height="30" fill="#fff" stroke-dasharray="2,2"/>
  <text x="571" y="49" class="sub" text-anchor="middle" font-size="9">AttnRes: layer input = weighted_sum(embed, prior block-sums)</text>

  <rect class="box" x="470" y="72" width="200" height="86" fill="#fff"/>
  <text x="570" y="86" class="sub" text-anchor="middle" font-weight="700" font-size="10">DiffusionBlock &#215; n_layers</text>
  <rect class="box" x="482" y="94" width="176" height="24" fill="#dceaff"/>
  <text x="570" y="110" class="sub" text-anchor="middle" font-size="9.5">x += LiZAttention2(norm1(h))</text>
  <rect class="box" x="482" y="128" width="176" height="24" fill="#fff3d6"/>
  <text x="570" y="144" class="sub" text-anchor="middle" font-size="9.5">x += FFN / MoE(norm2(x))</text>
  <path class="arr" d="M570,60 L570,72"/>

  <text x="571" y="170" class="note" text-anchor="middle">accumulate x; close block every attnres_block_size layers</text>
  <path class="arr" d="M736,91 L750,91"/>

  <!-- ScaleRouter.scatter + PyramidalCodec.decode -->
  <rect x="750" y="20" width="185" height="145" rx="6" fill="#f6effb" stroke="#8a6bb0" stroke-width="1.1"/>
  <text x="842" y="34" class="group-label" text-anchor="middle">scatter_active</text>
  <text x="842" y="45" class="note" text-anchor="middle">write each scale's chunk back</text>
  <text x="842" y="56" class="note" text-anchor="middle">to its positions</text>
  <rect class="box" x="765" y="68" width="155" height="34" fill="#fff"/>
  <text x="842" y="82" class="sub" text-anchor="middle" font-size="9.5">PyramidalCodec.decode</text>
  <text x="842" y="94" class="note" text-anchor="middle">concat &#8594; norm &#8594; fusion Linear</text>
  <path class="arr" d="M842,60 L842,68"/>
  <text x="842" y="120" class="note" text-anchor="middle">fusion tied to .encode</text>
  <text x="842" y="131" class="note" text-anchor="middle">weights (patch mode)</text>
  <path class="arr" d="M935,91 L959,91"/>

  <!-- norm / head / logits -->
  <rect class="box" x="959" y="70" width="82" height="42" fill="#dbe7fb"/>
  <text x="1000" y="94" class="sub" text-anchor="middle" font-size="9.5">KairosNorm</text>
  <path class="arr" d="M1041,91 L1063,91"/>

  <rect class="box" x="1063" y="65" width="90" height="52" fill="#dbe7fb"/>
  <text x="1108" y="86" class="sub" text-anchor="middle" font-size="9.5">OutputHead</text>
  <text x="1108" y="98" class="note" text-anchor="middle">tied weights</text>

  <rect class="box" x="1040" y="140" width="150" height="34" fill="#eaf1fb"/>
  <text x="1115" y="161" class="sub" text-anchor="middle" font-size="9.5">token/octet logits</text>
  <path class="arr" d="M1108,117 L1115,140"/>

  <!-- KairosCache -->
  <rect x="406" y="196" width="330" height="46" rx="5" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="571" y="209" class="sub" text-anchor="middle" font-weight="700" font-size="10">KairosCache (per scale)</text>
  <text x="571" y="221" class="note" text-anchor="middle">conv_caches + ssm_caches (DeltaNet), carried across streaming steps</text>
  <text x="571" y="232" class="note" text-anchor="middle">SWA: separate windowed K/V cache, not carried across batches</text>
  <path class="dashed" d="M571,181 L571,196"/>

  <!-- Memory gate: cross-session, outside forward -->
  <rect x="760" y="196" width="200" height="46" rx="5" fill="#fdeef0" stroke="#b5566b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="860" y="209" class="sub" text-anchor="middle" font-weight="700" font-size="10">KairosMemoryGate</text>
  <text x="860" y="221" class="note" text-anchor="middle">gate_memory_bank(): blends ssm_caches</text>
  <text x="860" y="232" class="note" text-anchor="middle">across sessions, between forward calls</text>
  <path class="dashed" d="M760,215 L736,215 L736,196"/>

  <!-- Training: curriculum + concrete example, on equal footing -->
  <rect x="6" y="254" width="1204" height="42" rx="6" fill="#fff6ea" stroke="#c99a3d" stroke-width="1.1"/>

  <text x="16" y="268" class="sub" font-weight="700" font-size="9.5">Curriculum:</text>
  <text x="16" y="280" class="note" font-size="8.5">stage 1 MAE (flat p_max, plain CE)</text>
  <text x="16" y="290" class="note" font-size="8.5">&#8594; stage 2 transition (linear ramp) &#8594; stage 3 diffusion (t~U(0,1), CE/p)</text>

  <line x1="330" y1="260" x2="330" y2="290" stroke="#c99a3d" stroke-width="1"/>

  <text x="345" y="268" class="sub" font-weight="700" font-size="9.5">Example (any stage, same mechanism):</text>
  <text x="345" y="282" class="mask">input:  The capital of France is &#9608;&#9608;&#9608;&#9608;&#9608; .</text>
  <text x="345" y="293" class="clean">output: The capital of France is Paris .</text>
  <text x="700" y="282" class="note" font-size="8.5">loss on masked</text>
  <text x="700" y="293" class="note" font-size="8.5">positions only</text>
</svg>
