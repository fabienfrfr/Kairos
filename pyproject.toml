[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-kit"
dynamic = ["version"]
description = "Hybrid MoE diffusion language model (DeltaNet + sliding-window attention) for multimodal edge AI"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Fabien Furfaro" }]
keywords = ["diffusion", "moe", "multimodal", "deltanet", "edge-ai", "transformers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Adapted for pip list in Kaggle
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "beautifulsoup4>=4.13.5",
    "datasets>=4.8",
    "einops>=0.8.2",
    "huggingface-hub>=1.10.1",
    "ipython>=7.34.0",
    "lxml>=6.0.3",
    "nbformat>=5.10.4",
    "numpy>=1.26",
    "pathspec>=1.1.1",
    "tensorboard>=2.19.0",
    "torch>=2.10.0",
    "transformers>=5.12.1", # mandatory for gemma
]

[project.urls]
Homepage = "https://github.com/fabienfrfr/Kairos"
Repository = "https://github.com/fabienfrfr/Kairos"

[project.optional-dependencies]
# `pip install -e ".[notebook]"` — everything notebook/kairos_multimodal_training.py needs on a bare Colab/Kaggle
notebook = [
    "marimo>=0.23.9",
    "matplotlib>=3.10.0",
    "pandas>=2.0",
    "tqdm>=4.67.0",
]



[tool.setuptools]
packages = ["kairos", "kairos.templates"]

[tool.setuptools.package-data]
kairos = ["templates/*.md"]

[tool.setuptools_scm]
version_file = "kairos/_version.py"
fallback_version = "0.0.0.dev0"  # editable/no-git-history installs (e.g. this sandbox's rebuilt checkout)


[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration"
]


[dependency-groups]
dev = [
    "altair>=5.5.0",
    "libzim>=3.10.0",
    "marimo>=0.23.9",
    "matplotlib>=3.10.0",
    "mwparserfromhell>=0.7.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
# scripts/ (dataset builders): `uv sync --group scripts` to install
scripts = [
    "av>=13.1.0",
    "requests>=2.32.3",
    "tqdm>=4.67.0",
]


[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"notebook/*.py" = ["PLR1711", "B018", "I001"]