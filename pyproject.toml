[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-fm"
dynamic = ["version"]
description = "KairosFM: less parameters, more signal. A hybrid MoE diffusion language model (DeltaNet + sliding-window attention) for multimodal edge AI"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Fabien Furfaro" }]
keywords = ["diffusion", "moe", "multimodal", "deltanet", "edge-ai", "transformers", "foundation-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Adapted for pip list in Kaggle
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "beautifulsoup4>=4.13.5",
    "datasets>=4.8",
    "einops>=0.8.2",
    "huggingface-hub>=1.10.1",
    "ipython>=7.34.0",
    "lxml>=6.0.3",
    "nbformat>=5.10.4",
    "numpy>=1.26",
    "pathspec>=1.1.1",
    "tensorboard>=2.19.0",
    "torch>=2.10.0",
    "transformers>=5.15.0", # mandatory for gemma
]

[project.urls]
Homepage = "https://github.com/fabienfrfr/Kairos"
Repository = "https://github.com/fabienfrfr/Kairos"

[project.optional-dependencies]
# `pip install -e ".[notebook]"` — everything the notebook needs on a bare Colab/Kaggle
notebook = [
    "marimo>=0.23.9",
    "matplotlib>=3.10.0",
    "pandas>=2.0",
    "tqdm>=4.67.0",
]
# ROCm build of PyTorch only, from AMD's official wheel index (download docs:
# https://rocm.docs.amd.com/en/latest/how-to/deep-learning/pytorch/install.html);
# pair with fast-attn-rocm for the fla/causal-conv1d kernels
rocm = [
    "rocm[libraries]==10.0.0; sys_platform == 'linux' and python_version < '3.14'",
    "torch[device-all]==2.13.0+rocm10.0.0; sys_platform == 'linux' and python_version < '3.14'",
    "triton>=3.8.0; sys_platform == 'linux' and python_version < '3.14'",
]
# fused Triton/CUDA kernels for KairosGatedDeltaNet; without this, falls back to slow pure-PyTorch
fast-attn = [
    "flash-linear-attention[cuda]>=0.5.1",
    "causal-conv1d>=1.4.0",
]
# same fused kernels on AMD GPUs; use together with the `rocm` extra and a ROCm HIP toolchain
fast-attn-rocm = [
    "flash-linear-attention[rocm]>=0.5.1",
    "causal-conv1d>=1.4.0",
]
# `pip install -e ".[cli]"` — everything the `kairos` command-line entry point needs
cli = [
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
kairos = "kairos.cli:app"

[tool.uv]
# AMD's ROCm wheels carry local-version tags; let the resolver pick the best
# match across both indexes (PyPI + AMD) instead of first-index-wins
index-strategy = "unsafe-best-match"
conflicts = [
    [
        { extra = "fast-attn" },
        { extra = "rocm" },
    ],
    [
        { extra = "fast-attn" },
        { extra = "fast-attn-rocm" },
    ],
]

[tool.uv.sources]
rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
torch = [{ index = "pytorch-rocm", extra = "rocm" }]
triton = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

# AMD's official ROCm wheels for PyTorch; see https://rocm.docs.amd.com/en/latest/how-to/deep-learning/pytorch/
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[tool.setuptools]
packages = ["kairos", "kairos.templates"]

[tool.setuptools.package-data]
kairos = ["templates/*.md"]

[tool.setuptools_scm]
version_file = "kairos/_version.py"
fallback_version = "0.4.0"  # editable/no-git-history installs (this sandbox's checkout)
local_scheme = "no-local-version"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration"
]


[dependency-groups]
dev = [
    "altair>=5.5.0",
    "libzim>=3.10.0",
    "marimo>=0.23.9",
    "matplotlib>=3.10.0",
    "mwparserfromhell>=0.7.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
# scripts/ (dataset builders): `uv sync --group scripts` to install
scripts = [
    "av>=13.1.0",
    "requests>=2.32.3",
    "tqdm>=4.67.0",
]


[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# marimo notebook source + its ipynb export share the same import ordering / relaxed rules
"notebook/*.py" = ["PLR1711", "B018", "I001"]
"notebook/*.ipynb" = ["PLR1711", "B018", "I001"]
# setuptools-scm regenerates this version file on every build; don't lint auto-generated code
"kairos/_version.py" = ["RUF022"]