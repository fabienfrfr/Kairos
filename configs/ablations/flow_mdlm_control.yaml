# flow-matching control arm: MDLM-style 1/p weighting, linear path; see docs/experiments/flow_matching.md
model:
  d_model: 64
  n_heads: 4
  n_layers: 1
  use_moe: false
  attn_type: liz2
  codec_mode: conv
data:
  text_examples:
  - &id001
    modality: text
    text: 'the quick brown fox jumps over the lazy dog the quick brown fox jumps over
      the lazy dog the quick brown fox jumps over the lazy dog the quick brown fox
      jumps over the lazy dog the quick brown fox jumps over the lazy dog the quick
      brown fox jumps over the lazy dog the quick brown fox jumps over the lazy dog
      the quick brown fox jumps over the lazy dog the quick brown fox jumps over the
      lazy dog the quick brown fox jumps over the lazy dog '
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  - *id001
  max_len: 128
  batch_size: 4
train:
  save_every: 10000
  run_dir: /tmp/ablations/flow_mdlm_control
  mask_eps: 0.001
  mask_reweight_clip: 10.0
