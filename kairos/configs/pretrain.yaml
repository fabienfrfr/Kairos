# One-command pretraining on a CUDA box: kairos pretrain pretrain  (HF_TOKEN in .env or the environment)
hf_data:
  multimodal_repo: ffurfaro/keep-it-simple-multimodal
  text_repo: ffurfaro/keep-it-simple
  text_pct: 100
  eval_pct: 0.001
  seed: 0

model:
  d_model: 64
  n_heads: 4
  n_layers: 4
  stride: 3
  num_modalities: 9
  num_scales: 4
  modality_scales: {0: [0, 1], 8: [0], 1: [1, 2], 4: [1], 3: [2], 2: [2, 3], 7: [3]}
  intermediate_size: 544
  moe_intermediate_size: 544
  use_moe: true
  n_routed_experts: 7
  num_local_experts: 7
  num_experts_per_tok: 1
  n_shared_experts: 1
  attnres_block_size: 4
  use_memory_gate: true
  share_backbones: true
  codec_mode: conv
  codec_conv_channels_per_group: 8

data:
  max_len: 1024
  stride: 3
  batch_size: 32
  pack: true

train:
  lr: 3.0e-4
  mae_epochs: 1
  transition_epochs: 1
  diffusion_epochs: 1
  mask_eps: 1.0e-3
  mask_mae_p_max: 0.3
  mask_mae_reweight: false
  mask_p_max: 1.0
  mask_reweight: true
  save_every: 200
  eval_every: 100
  eval_batches: 2
  run_dir: checkpoints/kairos-multimodal/run_01
  hub_repo_id: ffurfaro/kairos
  hub_push_every_ckpt: false
  hub_private: false
